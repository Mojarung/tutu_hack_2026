[project]
name = "obratno"
version = "0.1.0"
description = "Карта времени на земле поверх Tutu MCP"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obratno"]

[tool.ruff]
line-length = 100
