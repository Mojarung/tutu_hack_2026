<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Обратно — карта времени на земле</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet" />
<link href="./vendor/maplibre-gl.css" rel="stylesheet" />
<link href="./styles.css" rel="stylesheet" />
</head>
<body>
<div id="map"></div>

<!-- Экран карты: только чат и карточки маршрутов. -->
<button class="pill edit-btn" id="edit-btn" type="button">
  <span class="dot-home"></span><span id="edit-label">Москва</span>
</button>

<section class="chatbar">
  <div class="chat-head"><b id="reachable">0</b> городов успеваю к <b id="deadline-label">22:00</b></div>
  <div class="chips" id="chips" hidden></div>
  <form class="ask" id="ask">
    <input id="ask-input" type="text" autocomplete="off" placeholder="дома к 23:00, хочу побыть подольше" />
    <button class="pill pill-go" type="submit" aria-label="Спросить">→</button>
  </form>
</section>

<aside class="card" id="card" hidden>
  <button class="card-close" id="card-close" type="button" aria-label="Закрыть">×</button>
  <div id="card-body"></div>
</aside>

<!-- Стартовый экран: здесь и только здесь задаются все настройки поиска. -->
<section class="gate" id="gate">
  <div class="gate-card">
    <h1 class="gate-title">Обратно</h1>
    <p class="gate-sub">сколько часов вы там пробудете, а не куда доехать</p>

    <button class="pill gate-field" id="gate-city" type="button">
      <span class="gate-k">откуда</span><span id="gate-city-name">Москва</span>
    </button>
    <label class="pill gate-field"><span class="gate-k">отъезд</span>
      <span class="gate-pair"><input id="gate-date" type="date" /><input id="gate-dtime" type="time" step="300" /></span>
    </label>
    <label class="pill gate-field"><span class="gate-k">дома</span>
      <span class="gate-pair"><input id="gate-rdate" type="date" /><input id="gate-time" type="time" step="300" /></span>
    </label>

    <div class="gate-group"><span class="gate-k">побыть хотя бы</span><div class="pill-group" id="ground"></div></div>
    <div class="gate-group"><span class="gate-k">билеты туда-обратно</span><div class="pill-group" id="budget"></div></div>

    <button class="pill gate-go" id="gate-go" type="button">искать</button>
  </div>
</section>

<div class="picker" id="picker" hidden>
  <div class="picker-card">
    <input id="picker-input" type="search" autocomplete="off" placeholder="поиск города" />
    <div class="picker-list" id="picker-list"></div>
    <button class="pill picker-close" id="picker-close" type="button">закрыть</button>
  </div>
</div>

<div class="boot" id="boot" hidden><span id="boot-text">веер расписаний</span></div>

<script src="./vendor/gsap.min.js"></script>
<script src="./app.js" type="module"></script>
</body>
</html>
