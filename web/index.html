<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Обратно — карта времени на земле</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet" />
<link href="./vendor/maplibre-gl.css" rel="stylesheet" />
<link href="./styles.css" rel="stylesheet" />
</head>
<body>
<div id="map"></div>

<header class="hud hud-top">
  <div class="cluster">
    <label class="pill pill-home">
      <span class="dot-home"></span>
      <select id="home-select" aria-label="Откуда"></select>
    </label>
    <div class="pill-group" id="dates"></div>
    <label class="pill pill-date">
      <input id="date-input" type="date" aria-label="Дата" />
    </label>
  </div>

</header>

<section class="hud hud-bottom">
  <div class="dial-wrap">
    <svg class="dial" id="dial" viewBox="0 0 240 240" role="slider" tabindex="0"
         aria-label="Дома к" aria-valuemin="720" aria-valuemax="1620" aria-valuenow="1320">
      <circle class="dial-track" cx="120" cy="120" r="104" />
      <circle class="dial-fill" id="dial-fill" cx="120" cy="120" r="104" />
      <g id="dial-ticks"></g>
      <g id="dial-handle">
        <circle class="dial-knob" cx="120" cy="16" r="13" />
      </g>
    </svg>
    <div class="dial-face">
      <span class="dial-label"><b id="reachable">0</b> городов успеваю</span>
      <span class="dial-time" id="dial-time">22:00</span>
    </div>
  </div>

  <div class="controls">
    <div class="pill-group" id="ground"></div>
    <div class="pill-group" id="budget"></div>
    <form class="ask" id="ask">
      <input id="ask-input" type="text" autocomplete="off"
             placeholder="хочу погулять полдня, дома к 23:00" />
      <button class="pill pill-go" type="submit" aria-label="Разобрать">→</button>
    </form>
    <div class="chips" id="chips" hidden></div>
  </div>
</section>

<aside class="card" id="card" hidden>
  <button class="card-close" id="card-close" type="button" aria-label="Закрыть">×</button>
  <div id="card-body"></div>
</aside>

<div class="legend" id="legend">
  <span class="legend-item"><i style="background:#E8734A"></i>впритык</span>
  <span class="legend-item"><i style="background:#E8A93C"></i>2 ч</span>
  <span class="legend-item"><i style="background:#6FA33F"></i>4 ч</span>
  <span class="legend-item"><i style="background:#1F8A5B"></i>день</span>
  <span class="legend-item legend-note"><i class="ring"></i>окно ответа Tutu</span>
</div>

<div class="boot" id="boot"><span id="boot-text">веер расписаний</span></div>

<script src="./vendor/gsap.min.js"></script>
<script src="./app.js" type="module"></script>
</body>
</html>
